<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Results summary component</title>
 
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <section>
  <div class="result">
 <h5>Your Result</h5> <br />
 <div class="circle">
  <div class="content">
    <h1 class="student">76 </h1>
    <p class="total">of 100</p>
  </div>
 </div>
 <div>
    <h3>Great</h3>
    <p>You scored higher than 65% of the people who have taken these tests.</p>
  </div>
</div>

<div class="summary">
  <h3>Summary</h3>
  <form>
    <input type="reaction" name="Reaction" value="Reaction 80 / 100">
    <input type="memory" name="Memory" value="Memory 92 / 100">
    <input type="verbal" name="Verbal" value="Verbal 61 / 100">
    <input type="visual" name="Visual" value="Visual 72 / 100">
  </form>
  <div class="continue">
    <p class="cont">Continue</p>
  </div>
  
</div>
</section>
  

  
  

  

  
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Abdrahmon</a>.
  </div>
</body>
</html>
